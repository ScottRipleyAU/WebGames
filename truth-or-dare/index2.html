            if (array.length === 0) return "No items available";
            return array[Math.floor(Math.random() * array.length)];
        }

        // Logic from your other page to find a valid partner
        function getRandomOpponent() {
            if (players.length === 0) return null;

            const currentPlayerName = players[currentPlayerIndex]?.name;
            let potentialOpponents = playerOpponents[currentPlayerName];

            // If no specific partner preferences, allow anyone except current player
            if (!potentialOpponents || potentialOpponents.length === 0) {
                potentialOpponents = [];
                for (let i = 0; i < players.length; i++) {
                    if (i !== currentPlayerIndex) {
                        potentialOpponents.push(players[i].name);
                    }
                }
                if (potentialOpponents.length === 0) return null;
            }

            const randomOpponentName = potentialOpponents[Math.floor(Math.random() * potentialOpponents.length)];
            return players.findIndex(p => p.name === randomOpponentName);
        }

            if (players.length === 0) {
                result.textContent = "No players found.";

            const opponentIndex = getRandomOpponent();
            if (opponentIndex === null) {

            const opponentName = players[opponentIndex].name;

                dare: { light: lightDares, medium: mediumDares, spicy: spicyDares }

            chosenText = getRandomItem(bank[type][selectedIntensity]);

            result.innerHTML = `
                <p class="text-category">${category}</p>
                <p class="opponent-text">${currentPlayerName} TO ${opponentName}</p>
                <p>${chosenText}</p>
            `;

        function updatePlayerName() {
            if (players.length > 0) {

            }
        }

        nextPlayerButton.addEventListener('click', () => {
            if (players.length > 0) {
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                updatePlayerName();
                result.innerHTML = '';
            }
