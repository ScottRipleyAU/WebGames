    if(d&&d.players&&d.players.length){S.players=d.players;S.links=d.links||{};uid=d.uid||d.players.length;return true;}
  }catch(e){}
  return false;
}
function seed(){
  var ex=[['Alex','F'],['Sam','M'],['Jess','F'],['Ben','M']];
  S.players=ex.map(function(p){return {id:nextId(),name:p[0],g:p[1]};});
  S.links={};
}

/* ---------- Engine ---------- */
function linkedPlayers(p){
  return (S.links[p.id]||[]).map(byId).filter(Boolean);
}
function feasibleCats(p){
  var L=linkedPlayers(p);
  var f=L.filter(function(x){return x.g==='F';}).length;
  var m=L.length-f;
  return Object.keys(ROLES).filter(function(k){
    if(k==='G'||k==='B')return false;
    var r=ROLES[k].slice();
    var i=r.indexOf(p.g);
    if(i<0)return false;
    r.splice(i,1);
    var needF=r.filter(function(x){return x==='F';}).length;
    var needM=r.length-needF;
    return f>=needF&&m>=needM;
  });
}
function assign(p,cat){
  var roles=ROLES[cat];
  var slots=new Array(roles.length);
  var mine=[];
  roles.forEach(function(r,i){if(r===p.g)mine.push(i);});
  slots[mine[rnd(mine.length)]]=p;
  var pool=shuffle(linkedPlayers(p));
  roles.forEach(function(r,i){
    if(slots[i])return;
    for(var k=0;k<pool.length;k++){
      if(pool[k].g===r){slots[i]=pool[k];pool.splice(k,1);return;}
    }
  });
  return slots;
}
function pickText(cat,list,tag){
  var key=cat+'|'+S.level+'|'+tag;
  var used=S.used[key]||[];
  var free=[];
  for(var i=0;i<list.length;i++){if(used.indexOf(i)<0)free.push(i);}
  if(!free.length){used=[];for(var j=0;j<list.length;j++)free.push(j);}
  var idx=free[rnd(free.length)];
  used.push(idx);
  S.used[key]=used;
  return list[idx];
}
function draw(){
  var p=S.players[S.turn];
  var lv=LVKEYS[S.level];
  var solo=p.g==='F'?'G':'B';
  var all=[solo].concat(feasibleCats(p));
  var useBank=!S.onlyMine,fallback=false;
  if(S.onlyMine){
    var have=all.filter(function(k){return customList(k,lv).length>0;});
    if(have.length){all=have;}else{useBank=true;fallback=true;}
  }
  var combos=all.filter(function(k){return k!==solo;});
  var hasSolo=all.indexOf(solo)>=0;
  var cat=(combos.length&&(!hasSolo||Math.random()<0.7))?combos[rnd(combos.length)]:solo;
  var pool=useBank?BANK[cat][lv].concat(customList(cat,lv)):customList(cat,lv);
  S.cur={pid:p.id,cat:cat,slots:assign(p,cat),text:pickText(cat,pool,useBank?'b':'m'),fallback:fallback};
}

/* ---------- Views ---------- */
function brand(stage){
  return '<header class="brand"><h1 class="logo">Pass the <span>Dare</span></h1><span class="stage">'+stage+'</span></header>';
}
function viewSetup(){
  var rows=S.players.map(function(p,i){
    return '<div class="prow">'+
      '<input type="text" id="name-'+p.id+'" data-name="'+p.id+'" value="'+esc(p.name)+'" placeholder="Player '+(i+1)+'" aria-label="Name of player '+(i+1)+'" maxlength="24">'+
      '<div class="seg" role="group" aria-label="Gender of player '+(i+1)+'">'+
        '<button class="f" data-g="F" data-id="'+p.id+'" aria-pressed="'+(p.g==='F')+'">Female</button>'+
        '<button class="m" data-g="M" data-id="'+p.id+'" aria-pressed="'+(p.g==='M')+'">Male</button>'+
      '</div>'+
      '<button class="x" data-remove="'+p.id+'" aria-label="Remove player '+(i+1)+'">&times;</button>'+
    '</div>';
  }).join('');
  return brand('Step 1 of 3')+
    '<h2>Who is playing?</h2>'+
    '<p class="lede">Add each player and pick their gender. These four are examples, so rename or remove them.</p>'+
    '<div class="panel"><div class="stack">'+rows+'</div>'+
      '<div class="row between"><button class="btn" id="add">+ Add player</button>'+
      '<button class="btn primary" id="to-links">Next: who plays with whom</button></div>'+
      (S.error?'<p class="err" role="alert">'+esc(S.error)+'</p>':'')+
    '</div>'+
    '<div class="row between"><button class="btn" id="open-dares">Your dares ('+customCount()+')</button>'+
    (S.onlyMine?'<span class="note">Only your dares are in play.</span>':'')+'</div>'+
    '<p class="note">For adults who are all happy to play. Anyone can swap a dare they are not comfortable with, at any time.</p>';
}
function viewLinks(){
  var cards=S.players.map(function(p){
    var others=S.players.filter(function(o){return o.id!==p.id;});
    var L=S.links[p.id]||[];
    var chips=others.map(function(o){
      return '<button class="chip" data-link="'+p.id+'|'+o.id+'" aria-pressed="'+(L.indexOf(o.id)>=0)+'"><span class="dot '+(o.g==='F'?'f':'m')+'"></span>'+esc(o.name||'Unnamed')+'</button>';
    }).join('');
    var hasOpp=linkedPlayers(p).length>0;
    return '<div class="panel">'+
      '<div class="row between"><div class="who"><span class="dot '+(p.g==='F'?'f':'m')+'"></span>'+esc(p.name||'Unnamed')+' interacts with</div>'+
      '<button class="btn small ghost" data-all="'+p.id+'">Select all</button></div>'+
      '<div class="chips">'+chips+'</div>'+
      (hasOpp?'':'<p class="note">Nobody selected yet, so '+esc(p.name||'this player')+' will only get solo dares.</p>')+
    '</div>';
  }).join('');
  return brand('Step 2 of 3')+
    '<h2>Who plays with whom?</h2>'+
    '<p class="lede">Tap the players each person is willing to do group dares with. Links work both ways, so picking Ben for Jess also picks Jess for Ben. You can untick either side.</p>'+
    '<div class="row"><button class="btn small" id="everyone">Link everyone with everyone</button></div>'+
    cards+
    '<div class="row between"><button class="btn" id="back-setup">Back</button><button class="btn primary" id="start">Start the game</button></div>';
}
function fill(text,slots,activeId){
  return esc(text).replace(/\{([abc])\}/g,function(m,k){
    var pl=slots['abc'.indexOf(k)];
    if(!pl)return '?';
    return '<span class="nm '+(pl.g==='F'?'f':'m')+(pl.id===activeId?' me':'')+'">'+esc(pl.name||'Unnamed')+'</span>';
  });
}
function viewPlay(){
  var c=S.cur,p=byId(c.pid);
  var order=S.players.map(function(x,i){
    return '<span class="o'+(i===S.turn?' now':'')+'"><span class="dot '+(x.g==='F'?'f':'m')+'" style="width:8px;height:8px"></span>'+esc(x.name||'Unnamed')+'</span>';
  }).join('');
  var pips=[0,1,2].map(function(i){return '<span class="pip l'+i+(i<=S.level?' on':'')+'"></span>';}).join('');
  var heatBtn=S.level<2
    ?'<button class="btn" id="heat">Turn up the heat: '+LEVELS[S.level+1]+'</button>'
    :'<button class="btn" disabled>Maximum heat</button>';
  var soloLabel=(c.cat==='G'||c.cat==='B')?'Solo dare':(TAGS[c.cat]+' dare');
  return brand('Playing')+
    '<div class="meter"><div class="row"><div class="pips" aria-hidden="true">'+pips+'</div><span class="lvl">'+LEVELS[S.level]+' level</span></div>'+heatBtn+'</div>'+
    '<div class="order" aria-label="Turn order">'+order+'</div>'+
    '<section class="dare l'+S.level+'" aria-live="polite">'+
      '<div class="stack"><span class="turn">On the spot</span><h2 class="turnname">'+esc(p.name||'Unnamed')+'</h2></div>'+
      '<span class="tag">'+soloLabel+'</span>'+
      '<p class="dtext">'+fill(c.text,c.slots,c.pid)+'</p>'+
      (c.fallback?'<p class="note">You have no dares of your own at this level yet, so this one is from the built-in set.</p>':'')+
      '<div class="actions"><button class="btn primary" id="next">Done, next player</button><button class="btn" id="swap">Swap this dare</button></div>'+
    '</section>'+
    '<div class="foot">'+
      (S.level>0?'<button class="btn small ghost" id="cool">Cool it down: '+LEVELS[S.level-1]+'</button>':'')+
      '<button class="btn small ghost" id="open-dares">Your dares</button>'+
      '<button class="btn small ghost" id="edit">Edit players</button>'+
    '</div>';
}
function viewDares(){
  var d=S.draft;
  var catOpts=Object.keys(ROLES).map(function(k){return '<option value="'+esc(k)+'"'+(k===d.cat?' selected':'')+'>'+esc(CATLABEL[k])+'</option>';}).join('');
  var lvOpts=LVKEYS.map(function(k,i){return '<option value="'+k+'"'+(k===d.level?' selected':'')+'>'+LEVELS[i]+'</option>';}).join('');
  var toks=['{a}','{b}','{c}'].slice(0,ROLES[d.cat].length).map(function(t){return '<button class="btn small tok" data-ins="'+t+'">'+t+'</button>';}).join('');
  var groups='';
  Object.keys(ROLES).forEach(function(c){
    LVKEYS.forEach(function(l,li){
      var list=customList(c,l);
      if(!list.length)return;
      groups+='<div><div class="gh">'+esc(c)+' &middot; '+LEVELS[li]+'</div>'+list.map(function(t,i){
        return '<div class="mine"><p>'+esc(t)+'</p><button class="btn small ghost" data-del="'+esc(c)+'|'+l+'|'+i+'" aria-label="Delete this dare">Delete</button></div>';
      }).join('')+'</div>';
    });
  });
  if(!groups)groups='<p class="note">Nothing here yet. Dares you add will show up in this list.</p>';
  return brand('Your dares')+
    '<h2>Add your own dares</h2>'+
    '<p class="lede">Pick who the dare is for and how intense it is, then type it. Use <span class="tok">{a}</span>, <span class="tok">{b}</span> and <span class="tok">{c}</span> where player names should appear. They are saved in this browser only.</p>'+
    '<div class="panel">'+
      '<div class="grid2">'+
        '<label class="fl" for="dare-cat">Category<select id="dare-cat">'+catOpts+'</select></label>'+
        '<label class="fl" for="dare-level">Level<select id="dare-level">'+lvOpts+'</select></label>'+
      '</div>'+
      '<p class="note">'+esc(ROLEHINT[d.cat])+'</p>'+
      '<label class="fl" for="dare-text">Dare<textarea id="dare-text" maxlength="300" placeholder="e.g. {b}, give {a} a 30-second foot rub.">'+esc(d.text)+'</textarea></label>'+
      '<div class="row between"><div class="row"><span class="note">Insert a name:</span>'+toks+'</div>'+
      '<button class="btn primary" id="add-dare">Add dare</button></div>'+
      (d.err?'<p class="err" role="alert">'+esc(d.err)+'</p>':'')+
    '</div>'+
    '<div class="panel">'+
      '<label class="sw" for="only-mine"><input type="checkbox" id="only-mine"'+(S.onlyMine?' checked':'')+'><span><span class="t">Only use my dares</span><br><span class="note">Leaves the built-in dares out. If you have none for the current level, the game uses the built-in ones for that turn so it never stalls.</span></span></label>'+
    '</div>'+
    '<div class="panel"><h2>Your list ('+customCount()+')</h2>'+groups+'</div>'+
    '<div class="panel"><h2>Back up your dares</h2>'+
      '<p class="note">Copy your list as text and keep it in a note. Paste it back here on any browser or device to load it. Loading adds to your list and skips dares you already have.</p>'+
      '<textarea id="backup-text" aria-label="Backup text" placeholder="Your copied dares appear here. To load dares, paste them here.">'+esc(S.backup.text)+'</textarea>'+
      '<div class="row"><button class="btn" id="export-dares">Copy my dares</button><button class="btn primary" id="import-dares">Load dares from text</button></div>'+
      (S.backup.msg?'<p class="note" role="status">'+esc(S.backup.msg)+'</p>':'')+
    '</div>'+
    '<div class="row"><button class="btn" id="dares-back">'+(S.prev==='play'?'Back to the game':'Back')+'</button></div>';
}
function render(){
  var app=document.getElementById('app');
  app.innerHTML=S.screen==='setup'?viewSetup():S.screen==='links'?viewLinks():S.screen==='dares'?viewDares():viewPlay();
}

/* ---------- Events ---------- */
function toggleLink(a,b){
  var A=S.links[a]||[],B=S.links[b]||[];
  var on=A.indexOf(b)<0;
  if(on){A.push(b);if(B.indexOf(a)<0)B.push(a);}
  else{A=A.filter(function(x){return x!==b;});B=B.filter(function(x){return x!==a;});}
  S.links[a]=A;S.links[b]=B;
}
function cleanLinks(){
  var ids=S.players.map(function(p){return p.id;});
  var out={};
  ids.forEach(function(id){out[id]=(S.links[id]||[]).filter(function(x){return ids.indexOf(x)>=0&&x!==id;});});
  S.links=out;
}
document.getElementById('app').addEventListener('input',function(e){
  var id=e.target.getAttribute&&e.target.getAttribute('data-name');
  if(id){var p=byId(id);if(p){p.name=e.target.value;}}
  if(e.target.id==='dare-text'){S.draft.text=e.target.value;}
  if(e.target.id==='backup-text'){S.backup.text=e.target.value;}
});
document.getElementById('app').addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='dare-cat'){S.draft.cat=e.target.value;S.draft.err='';render();}
  else if(id==='dare-level'){S.draft.level=e.target.value;S.draft.err='';render();}
  else if(id==='only-mine'){S.onlyMine=e.target.checked;S.dirty=true;S.used={};saveCustom();render();}
});
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t)return;
  var d=t.dataset;
  if(d.g){var p=byId(d.id);if(p){p.g=d.g;}render();return;}
  if(d.remove){S.players=S.players.filter(function(x){return x.id!==d.remove;});S.error='';render();return;}
  if(t.id==='add'){
    var np={id:nextId(),name:'',g:'F'};S.players.push(np);render();
    var el=document.getElementById('name-'+np.id);if(el)el.focus();return;
  }
  if(t.id==='to-links'){
    S.players.forEach(function(p,i){if(!p.name.trim())p.name='Player '+(i+1);else p.name=p.name.trim();});
    if(S.players.length<2){S.error='Add at least two players to start.';render();return;}
    S.error='';cleanLinks();save();S.screen='links';render();return;
  }
  if(d.link){var parts=d.link.split('|');toggleLink(parts[0],parts[1]);save();render();return;}
  if(d.all){S.players.forEach(function(o){if(o.id!==d.all){var L=S.links[d.all]||[];if(L.indexOf(o.id)<0)toggleLink(d.all,o.id);}});save();render();return;}
  if(t.id==='everyone'){
    S.players.forEach(function(a){S.players.forEach(function(b){if(a.id!==b.id){var L=S.links[a.id]||[];if(L.indexOf(b.id)<0)toggleLink(a.id,b.id);}});});
    save();render();return;
  }
  if(t.id==='back-setup'){S.screen='setup';render();return;}
  if(t.id==='start'){S.level=0;S.turn=0;S.used={};draw();S.screen='play';render();return;}
  if(t.id==='next'){S.turn=(S.turn+1)%S.players.length;draw();render();return;}
  if(t.id==='swap'){draw();render();return;}
  if(t.id==='heat'){if(S.level<2){S.level+=1;draw();render();}return;}
  if(t.id==='cool'){if(S.level>0){S.level-=1;draw();render();}return;}
  if(t.id==='edit'){S.screen='setup';render();return;}
  if(t.id==='open-dares'){S.prev=S.screen;S.screen='dares';render();return;}
  if(t.id==='dares-back'){
    S.screen=S.prev||'setup';
    if(S.screen==='play'&&S.dirty){draw();}
    S.dirty=false;render();return;
  }
  if(d.ins){
    var ta=document.getElementById('dare-text');
    var s=ta.selectionStart||0,en=ta.selectionEnd||s;
    S.draft.text=ta.value.slice(0,s)+d.ins+ta.value.slice(en);
    render();
    ta=document.getElementById('dare-text');ta.focus();
    var pos=s+d.ins.length;ta.setSelectionRange(pos,pos);return;
  }
  if(t.id==='add-dare'){
    var txt=(S.draft.text||'').replace(/\s+/g,' ').trim();
    if(!txt){S.draft.err='Type a dare first.';render();return;}
    var c=S.draft.cat,l=S.draft.level;
    S.custom[c]=S.custom[c]||{};
    S.custom[c][l]=(S.custom[c][l]||[]).concat([txt.slice(0,300)]);
    S.draft.text='';S.draft.err='';S.dirty=true;S.used={};saveCustom();
    render();document.getElementById('dare-text').focus();return;
  }
  if(t.id==='export-dares'){
    if(!customCount()){S.backup.msg='You have no dares to copy yet.';render();return;}
    var tx=JSON.stringify({passTheDare:1,custom:S.custom});
    S.backup.text=tx;
    var fin=function(m){S.backup.msg=m;render();var b=document.getElementById('backup-text');if(b){b.focus();b.select();}};
    var manual='Select the text above and copy it, then keep it somewhere safe.';
    try{navigator.clipboard.writeText(tx).then(function(){fin('Copied. Paste it into a note to keep it safe.');},function(){fin(manual);});}
    catch(err){fin(manual);}
    return;
  }
  if(t.id==='import-dares'){
    S.backup.msg=importDares((S.backup.text||'').trim());
    render();return;
  }
  if(d.del){
    var q=d.del.split('|');
    var arr=customList(q[0],q[1]).slice();
    arr.splice(parseInt(q[2],10),1);
    S.custom[q[0]][q[1]]=arr;
    S.dirty=true;S.used={};saveCustom();render();return;
  }
});

if(!load())seed();
loadCustom();
render();
</script>

</body>
